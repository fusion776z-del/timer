<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Study Focus</title>

<style>

:root{
 --bg:#0b1020;
 --card:#171d2e;
 --blue:#67e8f9;
 --text:#ffffff;
 --sub:#8f9bb3;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:sans-serif;
 min-height:100vh;
 padding-bottom:80px;
}
.frame-wrap{
  position:relative;
  width:100%;
  min-height:100vh;
}

.ornament-frame{

  position:fixed;

  inset:0;

  width:100vw;
  height:100vh;

  object-fit:cover;

  pointer-events:none;

  z-index:1;

  opacity:.95;

  filter:
    drop-shadow(0 0 10px #67e8f9)
    drop-shadow(0 0 30px #67e8f9);

}
.ornament-frame{

 position:fixed;
 inset:0;

 width:100vw;
 height:100vh;

 object-fit:cover;

 pointer-events:none;

 z-index:1;

 filter:
 drop-shadow(0 0 10px #67e8f9)
 drop-shadow(0 0 25px #67e8f9)
 drop-shadow(0 0 50px #67e8f9);

}



.page{

  position:relative;

  z-index:10;

}
.page{
 padding:20px;
}

.mode-area{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:20px;
 margin-top:20px;
}

.mode-card{
  width:min(26vw,120px);
  height:min(26vw,120px);
  min-width:80px;
  min-height:80px;

  border:2px solid rgba(255,255,255,.15);
  border-radius:20px;

  background:rgba(255,255,255,.03);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  cursor:pointer;
  position:relative;
  z-index:100;
}
.mode-card::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:24px;
  border:2px solid rgba(255,255,255,.25);
  pointer-events:none;
}
.mode-card.active{
 background:rgba(103,232,249,.25);

 box-shadow:
 0 0 15px #67e8f9,
 0 0 30px #67e8f9,
 0 0 60px rgba(103,232,249,.8),
 inset 0 0 30px rgba(103,232,249,.25);
}

.mode-title{
 font-size:24px;
}

.mode-time{
 margin-top:10px;
 font-size:20px;
}

.timer-ring{

 width:min(80vw,320px);
 height:min(80vw,320px);

 margin:20px auto;

 filter:
  drop-shadow(0 0 8px #67e8f9);

}

.mode-label{

  margin-top:6px;

  font-weight:bold;

}

.timer-ring{

  filter:
    drop-shadow(0 0 8px #67e8f9);

}

@media (max-width:400px){

 .page{
   padding:10px;
 }

 .mode-area{
   gap:10px;
 }

 .controls{
   gap:12px;
 }

 .controls button{

   width:60px;
   height:60px;

   font-size:24px;
 }

}

.timer-ring svg{
 width:100%;
 height:100%;
}

.bg-ring{
 fill:none;
 stroke:#27324a;
 stroke-width:16;
}

.progress-ring{
  fill:none;
  stroke:#67e8f9;
  stroke-width:16;
  stroke-linecap:round;

  transform: rotate(-90deg);
  transform-origin: center;

  transition: stroke-dashoffset 1s linear;
}

.timer-center{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}

.focus-label{
 font-size:24px;
 margin-bottom:10px;
}

#realClock{

 text-align:center;

 margin-top:20px;
 margin-bottom:10px;

}

#realDate{

 color:#67e8f9;

 font-size:16px;

 letter-spacing:2px;

 text-shadow:
 0 0 8px #67e8f9;

}

#realTime{

 color:#67e8f9;

 font-size:clamp(22px,7vw,32px);

 font-weight:bold;

 text-shadow:
 0 0 12px #67e8f9;

}

#timerDisplay{
 font-size:clamp(38px,12vw,54px);
 font-weight:bold;
}

.session-dots{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-top:15px;
}

.session-dots span{
 width:12px;
 height:12px;
 border-radius:50%;
 background:#39445f;
}

.session-dots span.done{
 background:var(--blue);
}

.controls{
 display:flex;
 justify-content:center;
 gap:10px;
 margin-top:20px;
}

.controls{

 display:flex;
 justify-content:center;
 gap:20px;
 margin-top:20px;

}

.controls button{

 width:70px;
 height:70px;

 border:none;
 border-radius:20px;

 background:#171d2e;

 color:#67e8f9;

 font-size:28px;

 cursor:pointer;

 transition:.25s;

 box-shadow:
   0 0 10px rgba(103,232,249,.15),
   inset 0 0 15px rgba(103,232,249,.05);

}

/* 開始ボタン */



/* ホバー・タップ */

.controls button:hover{

 transform:translateY(-3px);

}

.controls button.active{

 background:#67e8f9;

 color:#08111f;

 box-shadow:
   0 0 10px #67e8f9,
   0 0 20px #67e8f9,
   0 0 30px rgba(103,232,249,.5);

}

.controls button:active{

 transform:scale(.95);

}

.save-card{
 background:var(--card);
 margin-top:25px;
 padding:15px;
 border-radius:16px;
}

select,
textarea{
 width:100%;
 margin-top:10px;
 padding:12px;
 border-radius:10px;
 border:none;
 background:#242d45;
 color:white;
}

textarea{
 height:80px;
 resize:none;
}

#saveBtn{
 width:100%;
 margin-top:10px;
 padding:14px;
 background:var(--blue);
 color:black;
 font-weight:bold;
 border:none;
 border-radius:12px;
}

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 height:65px;
 background:#111827;
 border-top:1px solid #222;
 display:flex;
}

.bottom-nav button{
 flex:1;
 background:none;
 border:none;
 color:white;
 font-size:22px;
}

#records{
 margin-top:15px;
}

.record{
 background:#171d2e;
 padding:10px;
 border-radius:10px;
 margin-bottom:8px;
}
.mode-icon{

 width:min(18vw,80px);
 height:min(18vw,80px);

 object-fit:cover;

 pointer-events:none;

 margin-top:8px;

}

.mode-label{

  margin-top:-3px;

  font-weight:bold;

}

@media (max-width:400px){

 .page{
   padding:10px;
 }

 .mode-area{
   gap:10px;
 }

 .controls{
   gap:12px;
 }

 .controls button{

   width:60px;
   height:60px;

   font-size:24px;
 }
.mode-icon{
  width:42px;
  height:42px;
}
 .focus-label{
   font-size:20px;
 }

}

</style>
</head>

<body>

<body>

<div class="frame-wrap">

  <img
    src="flame.png"
    class="ornament-frame"
    alt=""
  >

  <div class="page">

<div id="realClock">

  <div id="realDate"></div>

  <div id="realTime"></div>

</div>

<div class="mode-area">

<div class="mode-card active" id="studyCard">

  <img
    src="focus.png"
    class="mode-icon"
    alt="集中"
  >

  <div class="mode-label">
    集中
  </div>


</div>

<div class="mode-card" id="breakCard">

  <img
    src="break.png"
    class="mode-icon"
    alt="休憩"
  >

  <div class="mode-label">
    休憩
  </div>

</div>
</div>


<div class="timer-ring">

<svg viewBox="0 0 300 300">

<circle
class="bg-ring"
cx="150"
cy="150"
r="120">
</circle>

<circle
id="progressRing"
class="progress-ring"
cx="150"
cy="150"
r="120">
</circle>

</svg>

<div class="timer-center">

<div class="focus-label" id="modeLabel">
集中
</div>

<div id="timerDisplay">
25:00
</div>

</div>

</div>


<div class="controls">

<button id="startBtn">▶</button>

<button id="pauseBtn">❚❚</button>

<button id="resetBtn">↻</button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
